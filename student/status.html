<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submission Status | Student Voice Portal</title>
<meta name="description" content="Student Voice Portal prototype: submit complaints and track their status.">
<link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-root="../" data-nav="track" data-page="status" data-area="public">
<a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 btn btn-light" href="#main">Skip to main content</a>
<div id="site-nav"></div>
<main id="main">

<div class="container-xl">
  <div class="page-head"><nav aria-label="Breadcrumb"><ol class="breadcrumb mb-2"><li class="breadcrumb-item"><a href="../index.html">Home</a></li><li class="breadcrumb-item"><a href="track.html">Track</a></li><li class="breadcrumb-item active" aria-current="page"><span id="stCrumb">Status</span></li></ol></nav>
    <h1 class="mb-0">Submission <span id="stRef"></span></h1>
  </div>
  <div id="statusBox" class="row g-4">
    <div class="col-lg-8">
      <section class="svp-panel svp-panel-pad mb-4" aria-labelledby="curH">
        <div class="d-flex justify-content-between align-items-center mb-3"><h2 id="curH" class="h6 mb-0">Current status</h2><span id="stStatus" aria-live="polite"></span></div>
        <div id="stTimeline"></div>
        <div id="stMessage" role="status"></div>
      </section>
      <section class="svp-panel mb-4" aria-labelledby="subH">
        <div class="panel-head"><h2 id="subH">Submission</h2></div>
        <dl class="row detail-list svp-panel-pad mb-0 pb-2">
          <div class="col-sm-6"><dt>Submission type</dt><dd id="stType"></dd></div>
          <div class="col-sm-6"><dt>Category</dt><dd id="stCategory"></dd></div>
          <div class="col-sm-6" id="stIssueWrap"><dt id="stIssueLabel">Complaint option</dt><dd id="stIssue"></dd></div>
          <div class="col-sm-6"><dt>Submitted on</dt><dd id="stDate"></dd></div>
        </dl>
      </section>
      <section class="svp-panel" aria-labelledby="respH">
        <div class="panel-head"><h2 id="respH">Department response</h2></div>
        <div class="svp-panel-pad" id="stResponse"></div>
      </section>
    </div>
    <div class="col-lg-4">
      <section class="svp-panel svp-panel-pad mb-3" id="stMeeting"></section>
      <a class="fw-bold" href="track.html">Track another submission</a>
    </div>
  </div>
</div>

</main>
<div id="site-footer"></div>
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
<script src="../js/student.js"></script>
</body>
</html>
